services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: interview_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Flask Backend
  backend:
    build: ./backend
    container_name: interview_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/interview_db
      FRONTEND_URL: http://localhost
    depends_on:
      - db

  # 3. React Frontend
  frontend:
    build: ./frontend
    container_name: interview_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: 